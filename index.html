<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Image to 3D Model | Img23d</title>

    <meta name="description" content="An online tool that turns 2D images into rounded 3D models." />
    <link rel="canonical" href="https://harry7557558.github.io/img23d/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="style.css" />

</head>
<body>

    <div id="loading-overlay">
        <div id="loading-spinner"></div>
        <span id="loading-status">Downloading...</span>
    </div>

    <canvas id="emscripten-canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <textarea id="output" rows="8" style="display:none"></textarea>

    <script type='text/javascript'>
      var loadingOverlay = document.getElementById('loading-overlay');
      var statusElement = document.getElementById('loading-status');
      var spinnerElement = document.getElementById('loading-spinner');

      var Module = {
        preRun: [],
        postRun: [function() {
          if (typeof onReady === 'function' && !window._onReadyCalled) {
            window._onReadyCalled = true;
            onReady();
          }
        }],
        print: (function() {
          var element = document.getElementById('output');
          if (element) element.value = '';
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight;
            }
          };
        })(),
        canvas: (function() {
          var canvas = document.getElementById('emscripten-canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (!text) {
            loadingOverlay.style.display = 'none';
          } else {
            statusElement.textContent = m ? m[1].trim() : text;
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function(event) {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = function(text) {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>


    <div id="legend">
        <svg id="axes" width="120" height="40">
            <g transform="translate(0,5)">
                <rect id="legend-scale" x="0" y="0" width="0" height="20" stroke="none" fill="rgba(96,96,96,0.7)" />
                <text id="legend-text" x="0" y="15" text-anchor="middle" alignment-baseline="top" stroke="none"
                    fill="white" font-family="monospace" font-size="1.2em"></text>
            </g>
        </svg>
    </div>

    <div id="control">
        <span style="line-height:1.5em;">2D to 3D Tool
          <span style="float:right;margin-top:-5px;">
            <a href="https://github.com/harry7557558/img23d#tips" target="_blank"
              title="Help/Tips">Help</a>
              ⋅
            <a href="https://github.com/harry7557558/img23d/" target="_blank"
              title="GitHub">GitHub</a>
          </span>
          <br/>Drag and Drop Transparent PNG</span>
        <br/><br/>
        <span>Mask image: channel, threshold</span>
        <br/>
        <span><select id="select-channel">
          <option value="0" selected>alpha</option>
          <option value="1">luma</option>
          <option value="2">chroma</option>
          <!-- <option value="3">min/max</option> -->
          <option value="3">min</option>
          <option value="4">max</option>
          <option value="5">red</option>
          <option value="6">green</option>
          <option value="7">blue</option>
        </select></span>
        <span><input type="range" id="slider-threshold" style="width:80px"
            min="1" max="254" value="128" /></span>
        <span><input type="checkbox" id="checkbox-reverse" />reverse</span>
        <br/>
        <span><input type="checkbox" id="checkbox-resample-boundary" checked />simplify boundary</span>
        <br/><br/>
        <span>+z:&nbsp;<input type="range" id="slider-z-pos" style="width:75px"
            min="0" max="999" value="500" /></span>
        <span>-z:&nbsp;<input type="checkbox" id="checkbox-double-sided"
            />&nbsp;<input type="range" id="slider-z-neg" style="width:75px"
            min="0" max="999" value="500" /></span>
        <br/>
        <span>clip&nbsp;<input type="checkbox" id="checkbox-clip"
          />&nbsp;+z:&nbsp;<input type="range" id="slider-clip-z-pos" style="width:60px"
            min="1" max="999" value="500" /></span>
        <span>-z:&nbsp;<input type="range" id="slider-clip-z-neg" style="width:60px"
            min="1" max="999" value="500" /></span>
        <br/>
        <span><input type="checkbox" id="checkbox-edge" />edges</span>&ensp;
        <span><input type="checkbox" id="checkbox-normal" checked />normal</span>&ensp;
        <span><input type="checkbox" id="checkbox-texture" checked />color</span>
        <br /><br />
        <span>Export:
          <input id="export-stl" type="button" value="STL" />
          <input id="export-ply" type="button" value="PLY" />
          <input id="export-obj" type="button" value="OBJ" />
          <input id="export-glb" type="button" value="GLB" />
        </span>
        <br/>
        <span>Plotter SVG: az&nbsp;<input type="number" id="svg-azimuth" value="30" step="5"
            style="width:42px" title="Azimuth (degrees)">°
          el&nbsp;<input type="number" id="svg-elevation" value="30" step="5"
            style="width:42px" title="Elevation (degrees)">°
          stroke&nbsp;<input type="number" id="svg-stroke" value="0.5" step="0.1" min="0.1"
            style="width:40px" title="Stroke width (px)">px
          <input id="export-svg" type="button" value="SVG" />
        </span>
        <br />
        <p id="error-message" style="display:none"></p>
    </div>

    <script>
        (function () {
            function loadScript(src, onload) {
                var script = document.createElement("script");
                script.src = src;
                if (onload) script.onload = onload;
                document.head.appendChild(script);
            }
            // Load script.js first so onReady is defined before module.js runs
            loadScript("script.js", function() {
                loadScript("module.js");
            });
        })();
    </script>

</body>

</html>
