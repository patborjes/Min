<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaktiv Planvisning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #header {
    background: #16213e;
    color: #e0e0e0;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid #0f3460;
    z-index: 10;
    flex-shrink: 0;
  }

  #header h1 {
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #a0c4ff;
  }

  #header span {
    font-size: 0.8rem;
    color: #666;
  }

  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  #plan-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  #plan-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
    user-select: none;
  }

  #svg-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .room-area {
    fill: rgba(100, 180, 255, 0.0);
    stroke: rgba(100, 180, 255, 0.0);
    stroke-width: 1.5;
    cursor: pointer;
    pointer-events: all;
    transition: fill 0.2s, stroke 0.2s;
  }

  .room-area:hover {
    fill: rgba(100, 180, 255, 0.18);
    stroke: rgba(100, 180, 255, 0.7);
  }

  .room-area.active {
    fill: rgba(100, 220, 180, 0.22);
    stroke: rgba(100, 220, 180, 0.9);
    stroke-width: 2;
  }

  /* Side panel */
  #panel {
    width: 380px;
    background: #16213e;
    border-left: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 20;
    overflow: hidden;
  }

  #panel.open {
    transform: translateX(0);
  }

  #panel-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    color: #666;
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 2;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }
  #panel-close:hover { color: #fff; background: rgba(255,255,255,0.08); }

  #room-render {
    height: 220px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    background: #0f1b2d;
  }

  #room-canvas {
    width: 100%;
    height: 100%;
  }

  #panel-info {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  #panel-info::-webkit-scrollbar { width: 4px; }
  #panel-info::-webkit-scrollbar-track { background: transparent; }
  #panel-info::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 2px; }

  .room-tag {
    display: inline-block;
    background: #0f3460;
    color: #a0c4ff;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #panel-name {
    font-size: 1.4rem;
    color: #e0e0e0;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.2;
  }

  #panel-area {
    font-size: 0.85rem;
    color: #7090b0;
    margin-bottom: 16px;
  }

  #panel-desc {
    font-size: 0.88rem;
    color: #a0b4c8;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .detail-card {
    background: #0f1b2d;
    border-radius: 8px;
    padding: 12px;
    border: 1px solid #0f3460;
  }

  .detail-card .label {
    font-size: 0.7rem;
    color: #506070;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .detail-card .value {
    font-size: 0.95rem;
    color: #c0d0e0;
    font-weight: 500;
  }

  .features-title {
    font-size: 0.75rem;
    color: #506070;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid #0f1b2d;
    font-size: 0.85rem;
    color: #90a8c0;
  }

  .feature-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #a0c4ff;
    flex-shrink: 0;
  }

  #hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(22, 33, 62, 0.85);
    color: #7090b0;
    font-size: 0.78rem;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #0f3460;
    pointer-events: none;
    transition: opacity 0.5s;
    white-space: nowrap;
  }

  #hint.hidden { opacity: 0; }
</style>
</head>

// --- Canvas room renderer ---
function drawRoom(canvas, roomData) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);

  const c = roomData.colors;
  const type = roomData.furniture;

  // Perspective room: floor, back wall, left wall, right wall, ceiling
  const vx = W * 0.5, vy = H * 0.38; // vanishing point
  const fl = 0.08, fr = 0.92, ft = 0.15, fb = 0.95; // floor corners (% of canvas)

  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, shadeColor(c.ceiling, -5));
  bg.addColorStop(1, shadeColor(c.ceiling, -20));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Floor
  ctx.beginPath();
  ctx.moveTo(W * fl, H * fb);
  ctx.lineTo(W * fr, H * fb);
  ctx.lineTo(vx + (W * fr - vx) * 0.65, vy + (H * fb - vy) * 0.65);
  ctx.lineTo(vx + (W * fl - vx) * 0.65, vy + (H * fb - vy) * 0.65);
  ctx.closePath();
  const floorGrad = ctx.createLinearGradient(W * 0.5, vy, W * 0.5, H * fb);
  floorGrad.addColorStop(0, shadeColor(c.floor, 10));
  floorGrad.addColorStop(1, shadeColor(c.floor, -15));
  ctx.fillStyle = floorGrad;
  ctx.fill();

  // Back wall
  const bwl = vx + (W * fl - vx) * 0.65;
  const bwr = vx + (W * fr - vx) * 0.65;
  const bwb = vy + (H * fb - vy) * 0.65;
  const bwt = vy + (H * ft - vy) * 0.65;
  ctx.beginPath();
  ctx.moveTo(bwl, bwb);
  ctx.lineTo(bwr, bwb);
  ctx.lineTo(bwr, bwt);
  ctx.lineTo(bwl, bwt);
  ctx.closePath();
  const wallGrad = ctx.createLinearGradient(0, bwt, 0, bwb);
  wallGrad.addColorStop(0, shadeColor(c.wall, 5));
  wallGrad.addColorStop(1, shadeColor(c.wall, -10));
  ctx.fillStyle = wallGrad;
  ctx.fill();

  // Left wall
  ctx.beginPath();
  ctx.moveTo(W * fl, H * fb);
  ctx.lineTo(bwl, bwb);
  ctx.lineTo(bwl, bwt);
  ctx.lineTo(W * fl, H * ft);
  ctx.closePath();
  const lwGrad = ctx.createLinearGradient(W * fl, 0, bwl, 0);
  lwGrad.addColorStop(0, shadeColor(c.wall, -20));
  lwGrad.addColorStop(1, shadeColor(c.wall, -5));
  ctx.fillStyle = lwGrad;
  ctx.fill();

  // Right wall
  ctx.beginPath();
  ctx.moveTo(W * fr, H * fb);
  ctx.lineTo(bwr, bwb);
  ctx.lineTo(bwr, bwt);
  ctx.lineTo(W * fr, H * ft);
  ctx.closePath();
  const rwGrad = ctx.createLinearGradient(bwr, 0, W * fr, 0);
  rwGrad.addColorStop(0, shadeColor(c.wall, -5));
  rwGrad.addColorStop(1, shadeColor(c.wall, -25));
  ctx.fillStyle = rwGrad;
  ctx.fill();

  // Ceiling
  ctx.beginPath();
  ctx.moveTo(W * fl, H * ft);
  ctx.lineTo(W * fr, H * ft);
  ctx.lineTo(bwr, bwt);
  ctx.lineTo(bwl, bwt);
  ctx.closePath();
  const ceilGrad = ctx.createLinearGradient(0, H * ft, 0, bwt);
  ceilGrad.addColorStop(0, shadeColor(c.ceiling, 5));
  ceilGrad.addColorStop(1, shadeColor(c.ceiling, -8));
  ctx.fillStyle = ceilGrad;
  ctx.fill();

  // Floor lines (perspective)
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.lineWidth = 0.5;
  for (let i = 1; i < 5; i++) {
    const t = i / 5;
    const x = lerp(W * fl, W * fr, t);
    ctx.beginPath();
    ctx.moveTo(x, H * fb);
    ctx.lineTo(lerp(x, vx, 0.65), lerp(H * fb, vy, 0.65));
    ctx.stroke();
  }

  // Draw furniture based on type
  drawFurniture(ctx, type, W, H, vx, vy, fl, fr, ft, fb, bwl, bwr, bwb, bwt, c);

  // Light spots on ceiling
  ctx.fillStyle = 'rgba(255,255,200,0.15)';
  const lights = type === 'theater' ? 6 : 3;
  for (let i = 0; i < lights; i++) {
    const lx = lerp(bwl + 30, bwr - 30, (i + 0.5) / lights);
    const ly = lerp(bwt + 5, bwt + 20, 0.5);
    ctx.beginPath();
    ctx.arc(lx, ly, 8, 0, Math.PI * 2);
    ctx.fill();
    // Cone of light
    ctx.beginPath();
    ctx.moveTo(lx - 4, ly + 4);
    ctx.lineTo(lx + 4, ly + 4);
    const cx = lerp(lx, W * 0.5, 0.1);
    const floorY = lerp(H * fb, vy, 0.35);
    ctx.lineTo(cx + 30, floorY);
    ctx.lineTo(cx - 30, floorY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,200,0.04)';
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,0.15)';
  }

  // Ambient occlusion edges
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  // floor/wall junction
  ctx.beginPath(); ctx.moveTo(W*fl, H*fb); ctx.lineTo(bwl, bwb); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*fr, H*fb); ctx.lineTo(bwr, bwb); ctx.stroke();
  // wall/ceil junction
  ctx.beginPath(); ctx.moveTo(W*fl, H*ft); ctx.lineTo(bwl, bwt); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*fr, H*ft); ctx.lineTo(bwr, bwt); ctx.stroke();
}

function drawFurniture(ctx, type, W, H, vx, vy, fl, fr, ft, fb, bwl, bwr, bwb, bwt, c) {
  // Project a point from floor coordinates (0-1, 0-1) to screen
  function floorPt(u, v) {
    const fx = lerp(W * fl, W * fr, u);
    const fy = H * fb;
    const bx = lerp(bwl, bwr, u);
    const by = bwb;
    return { x: lerp(fx, bx, v), y: lerp(fy, by, v) };
  }

  function wallPt(u, h) {
    const bx = lerp(bwl, bwr, u);
    const bot = bwb, top = bwt;
    return { x: bx, y: lerp(bot, top, h) };
  }

  if (type === 'office') {
    // Desk
    drawBox3D(ctx, floorPt(0.25, 0.5), floorPt(0.55, 0.5), floorPt(0.55, 0.62), floorPt(0.25, 0.62),
      W, H, vx, vy, fl, fr, ft, fb, bwl, bwr, bwb, bwt, shadeColor(c.accent, 20), 0.12);
    // Chair
    drawCircle3D(ctx, floorPt(0.40, 0.45), 14, c.accent);
    // Window on back wall
    drawWindow(ctx, wallPt(0.35, 0.3), wallPt(0.65, 0.75), c.wall);
    // Bookshelf on left side
    const s1 = floorPt(0.05, 0.55); const s2 = floorPt(0.18, 0.55);
    const s3 = floorPt(0.18, 0.9); const s4 = floorPt(0.05, 0.9);
    ctx.fillStyle = shadeColor(c.accent, -20);
    drawQuad(ctx, s1, s2, s3, s4);
  }

  else if (type === 'openoffice') {
    // Multiple desks
    const deskCols = 3, deskRows = 2;
    for (let r = 0; r < deskRows; r++) {
      for (let col = 0; col < deskCols; col++) {
        const u = 0.15 + col * 0.25;
        const v = 0.35 + r * 0.3;
        drawBox3D(ctx, floorPt(u, v), floorPt(u+0.18, v), floorPt(u+0.18, v+0.12), floorPt(u, v+0.12),
          W, H, vx, vy, fl, fr, ft, fb, bwl, bwr, bwb, bwt, shadeColor(c.accent, 15), 0.08);
        drawCircle3D(ctx, floorPt(u + 0.09, v - 0.04), 8, c.accent);
      }
    }
    drawWindow(ctx, wallPt(0.2, 0.2), wallPt(0.8, 0.75), c.wall);
  }

  else if (type === 'meeting') {
    // Conference table (oval-ish)
    const t1 = floorPt(0.25, 0.4); const t2 = floorPt(0.75, 0.4);
    const t3 = floorPt(0.75, 0.7); const t4 = floorPt(0.25, 0.7);
    ctx.fillStyle = shadeColor(c.accent, 10);
    drawQuad(ctx, t1, t2, t3, t4);
    ctx.strokeStyle = shadeColor(c.accent, -10); ctx.lineWidth = 1;
    drawQuadStroke(ctx, t1, t2, t3, t4);
    // Chairs around
    for (let i = 0; i < 5; i++) {
      const u = 0.3 + i * 0.1;
      drawCircle3D(ctx, floorPt(u, 0.28), 9, c.accent);
      drawCircle3D(ctx, floorPt(u, 0.78), 9, c.accent);
    }
    // Projector screen on back wall
    ctx.fillStyle = 'rgba(240,240,255,0.7)';
    const ps1 = wallPt(0.2, 0.25); const ps2 = wallPt(0.8, 0.25);
    const ps3 = wallPt(0.8, 0.75); const ps4 = wallPt(0.2, 0.75);
    drawQuad(ctx, ps1, ps2, ps3, ps4);
  }

  else if (type === 'theater') {
    // Rows of seats
    for (let row = 0; row < 5; row++) {
      const v = 0.2 + row * 0.14;
      const seats = 8 - row;
      for (let s = 0; s < seats; s++) {
        const u = (1 - seats * 0.1) / 2 + s * 0.1;
        const p = floorPt(u + 0.05, v);
        ctx.fillStyle = row % 2 === 0 ? '#8a2020' : '#6a1818';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // Stage
    const stg1 = floorPt(0.1, 0.78); const stg2 = floorPt(0.9, 0.78);
    const stg3 = floorPt(0.9, 0.97); const stg4 = floorPt(0.1, 0.97);
    ctx.fillStyle = '#3a2000';
    drawQuad(ctx, stg1, stg2, stg3, stg4);
    // Stage lights on back wall
    for (let i = 0; i < 5; i++) {
      const wp = wallPt(0.15 + i * 0.175, 0.85);
      ctx.fillStyle = '#c8a020';
      ctx.beginPath(); ctx.arc(wp.x, wp.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(200,160,32,0.1)';
    const stgCenter = floorPt(0.5, 0.88);
    ctx.beginPath();
    ctx.arc(stgCenter.x, stgCenter.y, 40, 0, Math.PI * 2);
    ctx.fill();
  }

  else if (type === 'lobby') {
    // Sofa groups
    const s1=floorPt(0.1,0.5); const s2=floorPt(0.35,0.5); const s3=floorPt(0.35,0.65); const s4=floorPt(0.1,0.65);
    ctx.fillStyle = shadeColor(c.accent, 0);
    drawQuad(ctx, s1, s2, s3, s4);
    // Coffee table
    drawBox3D(ctx, floorPt(0.4,0.45), floorPt(0.6,0.45), floorPt(0.6,0.6), floorPt(0.4,0.6),
      W,H,vx,vy,fl,fr,ft,fb,bwl,bwr,bwb,bwt, shadeColor(c.accent,-10), 0.06);
    // Reception desk
    const r1=floorPt(0.6,0.35); const r2=floorPt(0.9,0.35); const r3=floorPt(0.9,0.55); const r4=floorPt(0.6,0.55);
    ctx.fillStyle = shadeColor(c.accent, 5);
    drawQuad(ctx, r1, r2, r3, r4);
    // Tall windows
    drawWindow(ctx, wallPt(0.1, 0.1), wallPt(0.4, 0.8), c.wall);
    drawWindow(ctx, wallPt(0.5, 0.1), wallPt(0.8, 0.8), c.wall);
  }

  else if (type === 'storage') {
    // Shelving units
    for (let col = 0; col < 4; col++) {
      const u = 0.08 + col * 0.23;
      const sh1=floorPt(u,0.35), sh2=floorPt(u+0.15,0.35), sh3=floorPt(u+0.15,0.95), sh4=floorPt(u,0.95);
      ctx.fillStyle = shadeColor(c.accent, col % 2 === 0 ? -15 : -25);
      drawQuad(ctx, sh1, sh2, sh3, sh4);
      for (let s = 0; s < 4; s++) {
        const sv = 0.4 + s * 0.14;
        const sw1=floorPt(u, sv), sw2=floorPt(u+0.15, sv);
        ctx.strokeStyle = shadeColor(c.accent, -40);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sw1.x, sw1.y); ctx.lineTo(sw2.x, sw2.y); ctx.stroke();
      }
    }
  }

  else if (type === 'corridor') {
    // Long corridor - just floor lines and door
    drawWindow(ctx, wallPt(0.3, 0.1), wallPt(0.7, 0.9), c.wall);
    // Door frame
    ctx.strokeStyle = shadeColor(c.wall, -30);
    ctx.lineWidth = 3;
    const d1 = wallPt(0.4, 0.1); const d2 = wallPt(0.6, 0.1);
    const d3 = wallPt(0.6, 0.85); const d4 = wallPt(0.4, 0.85);
    ctx.beginPath(); ctx.moveTo(d4.x, d4.y); ctx.lineTo(d1.x, d1.y); ctx.lineTo(d2.x, d2.y); ctx.lineTo(d3.x, d3.y); ctx.stroke();
  }

  else if (type === 'technical') {
    // Server racks / equipment
    for (let i = 0; i < 3; i++) {
      const u = 0.15 + i * 0.25;
      const e1=floorPt(u,0.4), e2=floorPt(u+0.15,0.4), e3=floorPt(u+0.15,0.85), e4=floorPt(u,0.85);
      ctx.fillStyle = i % 2 === 0 ? '#303840' : '#282e34';
      drawQuad(ctx, e1, e2, e3, e4);
      // Blinking lights
      for (let l = 0; l < 5; l++) {
        const lp = floorPt(u + 0.04 + (l % 3) * 0.03, 0.42 + l * 0.08);
        ctx.fillStyle = l % 2 === 0 ? '#00ff80' : '#ff8000';
        ctx.beginPath(); ctx.arc(lp.x, lp.y, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  else if (type === 'dressing') {
    // Mirror wall
    ctx.fillStyle = 'rgba(200,220,240,0.3)';
    drawQuad(ctx, wallPt(0.05, 0.05), wallPt(0.95, 0.05), wallPt(0.95, 0.9), wallPt(0.05, 0.9));
    ctx.strokeStyle = 'rgba(180,200,220,0.5)'; ctx.lineWidth = 2;
    drawQuadStroke(ctx, wallPt(0.05, 0.05), wallPt(0.95, 0.05), wallPt(0.95, 0.9), wallPt(0.05, 0.9));
    // Dressing table
    drawBox3D(ctx, floorPt(0.1,0.55), floorPt(0.9,0.55), floorPt(0.9,0.7), floorPt(0.1,0.7),
      W,H,vx,vy,fl,fr,ft,fb,bwl,bwr,bwb,bwt, shadeColor(c.accent,5), 0.1);
    // Clothes rail
    ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
    const cr1 = floorPt(0.1, 0.3); const cr2 = floorPt(0.9, 0.3);
    ctx.beginPath(); ctx.moveTo(cr1.x, cr1.y - 30); ctx.lineTo(cr2.x, cr2.y - 30); ctx.stroke();
  }

  else if (type === 'rehearsal') {
    // Dance floor / rehearsal room
    // Mirrors on back wall
    ctx.fillStyle = 'rgba(200,220,240,0.25)';
    drawQuad(ctx, wallPt(0.05, 0.05), wallPt(0.95, 0.05), wallPt(0.95, 0.92), wallPt(0.05, 0.92));
    // Barre
    ctx.strokeStyle = '#8a6040'; ctx.lineWidth = 4;
    const b1 = floorPt(0.05, 0.35); const b2 = floorPt(0.95, 0.35);
    ctx.beginPath(); ctx.moveTo(b1.x, b1.y - 25); ctx.lineTo(b2.x, b2.y - 25); ctx.stroke();
    // Stacked chairs on side
    for (let i = 0; i < 4; i++) {
      const cp = floorPt(0.05, 0.75 + i * 0.05);
      ctx.fillStyle = shadeColor(c.accent, -10 + i * 5);
      ctx.beginPath(); ctx.arc(cp.x, cp.y, 8, 0, Math.PI * 2); ctx.fill();
    }
  }

  else if (type === 'workshop') {
    // Work benches
    for (let i = 0; i < 2; i++) {
      const u = 0.08 + i * 0.48;
      drawBox3D(ctx, floorPt(u,0.4), floorPt(u+0.38,0.4), floorPt(u+0.38,0.58), floorPt(u,0.58),
        W,H,vx,vy,fl,fr,ft,fb,bwl,bwr,bwb,bwt, shadeColor(c.accent,-10), 0.1);
    }
    // Tool wall
    ctx.fillStyle = shadeColor(c.wall, -15);
    drawQuad(ctx, wallPt(0.05, 0.05), wallPt(0.95, 0.05), wallPt(0.95, 0.85), wallPt(0.05, 0.85));
    for (let t = 0; t < 8; t++) {
      const tp = wallPt(0.1 + t * 0.1, 0.4);
      ctx.fillStyle = '#808080';
      ctx.beginPath(); ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2); ctx.fill();
    }
  }

  else if (type === 'gym') {
    // Mirror wall
    ctx.fillStyle = 'rgba(200,220,240,0.25)';
    drawQuad(ctx, wallPt(0.05, 0.05), wallPt(0.95, 0.05), wallPt(0.95, 0.92), wallPt(0.05, 0.92));
    // Exercise mats on floor
    for (let i = 0; i < 3; i++) {
      const u = 0.08 + i * 0.3;
      const m1=floorPt(u,0.45), m2=floorPt(u+0.22,0.45), m3=floorPt(u+0.22,0.82), m4=floorPt(u,0.82);
      ctx.fillStyle = i % 2 === 0 ? '#4a7858' : '#3a6048';
      drawQuad(ctx, m1, m2, m3, m4);
    }
  }

  else if (type === 'bathroom') {
    // Tiles on wall
    ctx.fillStyle = '#e0eef4';
    drawQuad(ctx, wallPt(0.0, 0.0), wallPt(1.0, 0.0), wallPt(1.0, 1.0), wallPt(0.0, 1.0));
    // Tile grid lines
    ctx.strokeStyle = 'rgba(150,180,200,0.4)'; ctx.lineWidth = 0.5;
    for (let i = 1; i < 8; i++) {
      const t = i / 8;
      const w1 = wallPt(t, 0); const w2 = wallPt(t, 1);
      ctx.beginPath(); ctx.moveTo(w1.x, w1.y); ctx.lineTo(w2.x, w2.y); ctx.stroke();
    }
    // Sink
    drawBox3D(ctx, floorPt(0.15,0.35), floorPt(0.4,0.35), floorPt(0.4,0.52), floorPt(0.15,0.52),
      W,H,vx,vy,fl,fr,ft,fb,bwl,bwr,bwb,bwt, '#c8dde4', 0.08);
    // Toilet
    drawBox3D(ctx, floorPt(0.6,0.35), floorPt(0.82,0.35), floorPt(0.82,0.58), floorPt(0.6,0.58),
      W,H,vx,vy,fl,fr,ft,fb,bwl,bwr,bwb,bwt, '#d8e8ec', 0.1);
  }

  else if (type === 'lounge') {
    // Sofa L-shape
    const s1=floorPt(0.05,0.4), s2=floorPt(0.55,0.4), s3=floorPt(0.55,0.6), s4=floorPt(0.05,0.6);
    ctx.fillStyle = shadeColor(c.accent, 5);
    drawQuad(ctx, s1, s2, s3, s4);
    // Coffee table
    drawBox3D(ctx, floorPt(0.2,0.65), floorPt(0.5,0.65), floorPt(0.5,0.78), floorPt(0.2,0.78),
      W,H,vx,vy,fl,fr,ft,fb,bwl,bwr,bwb,bwt, shadeColor(c.accent,-10), 0.05);
    // Kitchen counter on right
    drawBox3D(ctx, floorPt(0.65,0.35), floorPt(0.95,0.35), floorPt(0.95,0.6), floorPt(0.65,0.6),
      W,H,vx,vy,fl,fr,ft,fb,bwl,bwr,bwb,bwt, shadeColor(c.accent,-5), 0.12);
    drawWindow(ctx, wallPt(0.2, 0.1), wallPt(0.6, 0.7), c.wall);
  }

  else {
    // Generic: just window
    drawWindow(ctx, wallPt(0.25, 0.2), wallPt(0.75, 0.75), c.wall);
  }
}

function drawBox3D(ctx, p1, p2, p3, p4, W, H, vx, vy, fl, fr, ft, fb, bwl, bwr, bwb, bwt, color, h) {
  // Top face of a box (slightly above floor)
  const liftY = H * h;
  const top1 = {x: p1.x, y: p1.y - liftY};
  const top2 = {x: p2.x, y: p2.y - liftY};
  const top3 = {x: p3.x, y: p3.y - liftY};
  const top4 = {x: p4.x, y: p4.y - liftY};
  // Front face
  ctx.fillStyle = shadeColor(color, -10);
  drawQuad(ctx, p3, p4, top4, top3);
  // Side face
  ctx.fillStyle = shadeColor(color, -20);
  drawQuad(ctx, p1, p4, top4, top1);
  // Top face
  ctx.fillStyle = shadeColor(color, 5);
  drawQuad(ctx, top1, top2, top3, top4);
}

function drawCircle3D(ctx, p, r, color) {
  ctx.fillStyle = shadeColor(color, -5);
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, r, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawWindow(ctx, p1, p2, wallColor) {
  // p1 = top-left, p2 = bottom-right on back wall
  // Sky gradient
  const sg = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
  sg.addColorStop(0, '#b0d4f0');
  sg.addColorStop(1, '#e8f4f8');
  ctx.fillStyle = sg;
  ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
  // Window frame
  ctx.strokeStyle = shadeColor(wallColor, -25);
  ctx.lineWidth = 2;
  ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
  // Cross bar
  const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
  ctx.beginPath(); ctx.moveTo(mx, p1.y); ctx.lineTo(mx, p2.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p1.x, my); ctx.lineTo(p2.x, my); ctx.stroke();
}

function drawQuad(ctx, p1, p2, p3, p4) {
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.lineTo(p3.x, p3.y);
  ctx.lineTo(p4.x, p4.y);
  ctx.closePath();
  ctx.fill();
}

function drawQuadStroke(ctx, p1, p2, p3, p4) {
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.lineTo(p3.x, p3.y);
  ctx.lineTo(p4.x, p4.y);
  ctx.closePath();
  ctx.stroke();
}

function lerp(a, b, t) { return a + (b - a) * t; }

function shadeColor(hex, pct) {
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.min(255, Math.max(0, r + pct * 2));
  g = Math.min(255, Math.max(0, g + pct * 2));
  b = Math.min(255, Math.max(0, b + pct * 2));
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// --- UI Logic ---
const panel = document.getElementById('panel');
const canvas = document.getElementById('room-canvas');
let activeArea = null;

document.querySelectorAll('.room-area').forEach(area => {
  area.addEventListener('click', function (e) {
    const id = this.dataset.room;
    const room = rooms[id];
    if (!room) return;

    // Deactivate previous
    if (activeArea) activeArea.classList.remove('active');
    this.classList.add('active');
    activeArea = this;

    // Fill panel
    document.getElementById('panel-tag').textContent = room.tag;
    document.getElementById('panel-name').textContent = room.name;
    document.getElementById('panel-area').textContent = room.area;
    document.getElementById('panel-desc').textContent = room.desc;

    const grid = document.getElementById('detail-grid');
    grid.innerHTML = room.details.map(d =>
      `<div class="detail-card"><div class="label">${d.label}</div><div class="value">${d.value}</div></div>`
    ).join('');

    document.getElementById('features-list').innerHTML = room.features.map(f =>
      `<div class="feature-item"><span class="feature-dot"></span>${f}</div>`
    ).join('');

    panel.classList.add('open');
    document.getElementById('hint').classList.add('hidden');

    // Render room after panel opens (wait for layout)
    requestAnimationFrame(() => {
      requestAnimationFrame(() => drawRoom(canvas, room));
    });
  });

  area.addEventListener('mouseenter', function () {
    const id = this.dataset.room;
    const room = rooms[id];
    if (room) {
      document.getElementById('hint').textContent = `${room.name} — ${room.area}`;
      document.getElementById('hint').classList.remove('hidden');
    }
  });

  area.addEventListener('mouseleave', function () {
    if (!panel.classList.contains('open')) {
      document.getElementById('hint').textContent = 'Pek på et rom for å utforske';
    } else {
      document.getElementById('hint').classList.add('hidden');
    }
  });
});

document.getElementById('panel-close').addEventListener('click', () => {
  panel.classList.remove('open');
  if (activeArea) { activeArea.classList.remove('active'); activeArea = null; }
  document.getElementById('hint').textContent = 'Pek på et rom for å utforske';
  document.getElementById('hint').classList.remove('hidden');
});

// Rerender on resize
window.addEventListener('resize', () => {
  if (panel.classList.contains('open') && activeArea) {
    const id = activeArea.dataset.room;
    const room = rooms[id];
    if (room) drawRoom(canvas, room);
  }
});
</script>
