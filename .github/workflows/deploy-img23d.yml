name: Deploy img23d to GitHub Pages

on:
  push:
    branches: [main, "claude/setup-img23d-app-Ov7PK", "claude/elegant-keller-LpdTs"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: img23d/
      - id: deployment
        uses: actions/deploy-pages@v4
