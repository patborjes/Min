name: Deploy img23d to GitHub Pages

on:
  push:
    branches: [main, "claude/setup-img23d-app-Ov7PK", "claude/elegant-keller-LpdTs"]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: img23d/
